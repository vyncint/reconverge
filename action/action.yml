# reconverge GitHub Action: run `cargo reconverge check` on a repo.
#
# The action ships inside the reconverge repository itself: when a workflow
# says `uses: vyncint/reconverge/action@<ref>`, the runner materializes the
# whole repo at that ref. The analyzer is installed from crates.io at the
# version that ref declares, so the ref still decides exactly which analyzer
# runs — it is fetched as a released version rather than compiled from the
# working tree.
#
# Nothing is cached. Every run installs the pinned toolchain and the pinned
# version from scratch, so a run can never inherit a stale binary from an
# earlier one, and what CI checks is always a published release.
#
# The analyzed project is compiled with reconverge's pinned nightly
# (exported as RUSTUP_TOOLCHAIN, overriding any toolchain file in the
# target repo): a rustc-driver tool and the rustc it wraps must be the
# same build. cuda-oxide projects already require this exact pin.
name: reconverge
description: >-
  Static reconvergence analysis for Rust GPU kernels — catches divergent
  barriers and non-convergent warp operations at compile time. No GPU
  required.
branding:
  icon: git-merge
  color: green

inputs:
  working-directory:
    description: Directory of the project to analyze.
    required: false
    default: "."
  cc:
    description: >-
      Target compute capability (X.Y, e.g. 8.6) for shared-memory capacity
      context (RC004). The CUDA spellings are accepted too: `sm_86` and `86`
      both mean 8.6.
    required: false
    default: ""
  strict:
    description: >-
      Also display warning-confidence findings ("true"/"false"). Warnings
      never affect the exit code.
    required: false
    default: "false"
  sarif:
    description: >-
      Path to also write a SARIF 2.1.0 report to (upload it with
      github/codeql-action/upload-sarif in a follow-up step).
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Through `$GITHUB_OUTPUT` rather than `$GITHUB_ENV`. Both carry the value
    # to the next step; only the environment file can *set* a variable the
    # runner itself acts on, which is why writing to it from a `run:` block is
    # flagged wherever the written value is not obviously the action's own.
    # These two are read out of this repository's checkout and nothing else,
    # but an output says that structurally instead of in a comment.
    - name: Install the pinned toolchain
      id: toolchain
      shell: bash
      run: |
        reconverge_root="$(cd "${GITHUB_ACTION_PATH}/.." && pwd)"
        echo "root=${reconverge_root}" >> "$GITHUB_OUTPUT"
        toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' "${reconverge_root}/rust-toolchain.toml")"
        if [ -z "${toolchain}" ]; then
          echo "no channel in ${reconverge_root}/rust-toolchain.toml" >&2
          exit 1
        fi
        # The exact nightly with what the driver needs and nothing else —
        # the same set `cargo reconverge setup` installs. A bare `rustup
        # toolchain install` inside the repo would read rust-toolchain.toml
        # and add the contributor components (rust-src, rustfmt, clippy) on
        # every consumer's run. `--no-self-update`: by default it also
        # replaces rustup itself, which is not this action's business and
        # can fail on its own (`failed to set permissions for
        # '…/rustup-init'` was seen doing exactly that).
        rustup toolchain install "${toolchain}" --profile minimal \
          --component rustc-dev --component llvm-tools --no-self-update
        echo "channel=${toolchain}" >> "$GITHUB_OUTPUT"

    - name: Install the analyzer
      shell: bash
      env:
        RECONVERGE_ROOT: ${{ steps.toolchain.outputs.root }}
        RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
      run: |
        # The version comes from the ref's own workspace manifest, so
        # `@<ref>` still chooses the analyzer; it is now resolved to a
        # released version instead of a build of the working tree.
        version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "${RECONVERGE_ROOT}/Cargo.toml" | head -n 1)"
        if [ -z "${version}" ]; then
          echo "could not read the workspace version from ${RECONVERGE_ROOT}/Cargo.toml" >&2
          exit 1
        fi
        echo "installing reconverge ${version} from crates.io"
        # --locked: both crates publish a Cargo.lock, so the dependency
        # graph is the one that release was tested against. Both binaries
        # land in the same directory, which is where `cargo-reconverge`
        # looks for the driver first (then on PATH).
        cargo install --locked \
          "cargo-reconverge@${version}" \
          "reconverge-driver@${version}"

    - name: cargo reconverge check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # The analyzed project is built with reconverge's pin, overriding any
        # rust-toolchain.toml the target repository carries: a rustc-driver
        # tool and the rustc it wraps must be the same build.
        RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
        INPUT_CC: ${{ inputs.cc }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_SARIF: ${{ inputs.sarif }}
      run: |
        args=()
        if [ -n "${INPUT_CC}" ]; then args+=(--cc "${INPUT_CC}"); fi
        if [ "${INPUT_STRICT}" = "true" ]; then args+=(--strict); fi
        if [ -n "${INPUT_SARIF}" ]; then args+=(--sarif "${INPUT_SARIF}"); fi
        cargo-reconverge reconverge check "${args[@]}"
