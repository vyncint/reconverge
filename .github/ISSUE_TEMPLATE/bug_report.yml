name: Bug report
description: Something misbehaves. For a wrong finding on correct code, use the "False positive" form instead.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Smallest kernel / command sequence that shows the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "`cargo reconverge --version` output"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS / environment
    validations:
      required: false
