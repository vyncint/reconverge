name: CI

on:
  push:
    branches: [main]
  pull_request:
  # workflow_dispatch exists for the macOS job (see below); the Linux gates
  # simply run again on that event. The weekly schedule that also drove it is
  # disabled below, so dispatch is now the only way to reach the macOS job.
  workflow_dispatch:
  # Scheduled runs are disabled. Uncomment the block below to restore them.
  # schedule:
  #   - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo fmt --all --check
      # conformance/extractor declares its own `[workspace]`, so every
      # workspace-scoped gate above stops at its door. It decides what the
      # published precision table measures, so it is held to the same bar;
      # a new standalone manifest must be added here too (CONTRIBUTING §7).
      - run: cargo fmt --manifest-path conformance/extractor/Cargo.toml --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The second workspace: see the note in the fmt job.
      - run: >-
          cargo clippy --manifest-path conformance/extractor/Cargo.toml
          --locked --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo test --workspace

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - uses: EmbarkStudios/cargo-deny-action@v2

  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: ./scripts/check-isolation.sh
      # No compiler catches a count that disagrees with its noun, and the
      # last sweep closed without a gate — so `466 gating finding(s)` was
      # still the headline of the published precision table two releases on.
      - run: ./scripts/check-plurals.sh

  # Zero-FP gate: upstream's example kernels through the tool, diffed
  # against the reviewed baseline (conformance/EXPECTED). Any new finding
  # on conformance fails CI. The mutation corpus then reuses the same
  # extraction and baseline: labeled bug injections, precision must stay
  # 1.0 and the published table (conformance/MUTATION.md) must match.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: ./scripts/run-conformance.sh
      - run: ./scripts/run-mutation-corpus.sh

  # The TUI suite is the reason macOS runs at all: terminal behavior is
  # where the platforms actually differ.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The gate scripts are Linux-only for cost, but their portability is
      # not: both prune with `sed` on every run, and the BSD form macOS
      # ships took the expression as a backup suffix and died. This is the
      # cheapest thing that reads them on the platform that broke.
      - run: bash -n scripts/run-conformance.sh scripts/run-mutation-corpus.sh

  # The single required status check: green iff every Linux gate is green.
  required-green:
    name: required-green
    if: always()
    needs: [fmt, clippy, test, docs, deny, isolation, conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gate succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gate results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "a required gate did not succeed" >&2
              exit 1
            fi
          done
