name: CI

on:
  push:
    branches: [main]
  pull_request:
  # workflow_dispatch exists for the macOS job (see below); the Linux gates
  # simply run again on that event. The weekly schedule that also drove it is
  # disabled below, so dispatch is now the only way to reach the macOS job.
  workflow_dispatch:
  # Scheduled runs are disabled. Uncomment the block below to restore them.
  # schedule:
  #   - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo fmt --all --check
      # conformance/extractor declares its own `[workspace]`, so every
      # workspace-scoped gate above stops at its door. It decides what the
      # published precision table measures, so it is held to the same bar;
      # a new standalone manifest must be added here too (CONTRIBUTING §7).
      - run: cargo fmt --manifest-path conformance/extractor/Cargo.toml --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The second workspace: see the note in the fmt job.
      - run: >-
          cargo clippy --manifest-path conformance/extractor/Cargo.toml
          --locked --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo test --workspace
        env:
          # Every screen a failing termlens wait embeds is also written here,
          # so the `report` step below can put the picture in the job summary
          # instead of leaving it in a log someone has to scroll (termlens
          # 0.10). A PTY failure *is* a picture, and a log is the worst place
          # to read one. With `default-features = false` there is no serde
          # feature, so these land as `.screen.txt`.
          TERMLENS_ARTIFACT_DIR: ${{ runner.temp }}/termlens
      # The termlens-cli suite is `#[ignore]`d so a plain `cargo test` never
      # `cargo install`s anything behind a contributor's or a packager's
      # back — both crates here are published. CI is where it should run, so
      # CI asks for it by name. The install is the version Cargo.lock names,
      # so the tool and the library are one release.
      - run: cargo test -p reconverge-tui --test cli -- --ignored
        env:
          TERMLENS_ARTIFACT_DIR: ${{ runner.temp }}/termlens
      # Renders every screen the suite left behind into the job summary, with
      # SVG and HTML uploaded. It installs termlens-cli itself, so nothing
      # else here has to.
      - uses: vyncint/termlens/.github/actions/report@b8af0fa457dd023aa708a493b7f485256009f1a5 # v0.11.0
        if: failure()
        with:
          name: termlens-report-linux

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - uses: EmbarkStudios/cargo-deny-action@v2

  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: ./scripts/check-isolation.sh
      # No compiler catches a count that disagrees with its noun, and the
      # last sweep closed without a gate — so `466 gating finding(s)` was
      # still the headline of the published precision table two releases on.
      - run: ./scripts/check-plurals.sh

  # Zero-FP gate: upstream's example kernels through the tool, diffed
  # against the reviewed baseline (conformance/EXPECTED). Any new finding
  # on conformance fails CI. The mutation corpus then reuses the same
  # extraction and baseline: labeled bug injections, precision must stay
  # 1.0 and the published table (conformance/MUTATION.md) must match.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: ./scripts/run-conformance.sh
      # The known-unknown gate: every public function in upstream's
      # synchronization and collective modules at the pinned checkout is
      # either classified by the dialect or allowlisted with a reason. An
      # unrecognized call is `Other` — a coverage note, never a finding — so
      # a new upstream primitive is a false negative until someone names it.
      - run: ./scripts/check-surface.sh target/conformance/upstream
      # ...and the gate's own failure paths, which is how #134 survived: it
      # reported PASS on a module whose `include!`d source was missing, so
      # the surface was never enumerated and nothing said so.
      - run: ./scripts/check-surface-selftest.sh
      - run: ./scripts/run-mutation-corpus.sh

  # The artifacts are the contract between the engine and every front-end,
  # and until 0.5.0 nothing validated one against a schema: the Rust
  # round-trip tests go through serde, which tolerates anything additive and
  # never sees a `const`. Both corpora, because they fail differently --
  # `fixtures/` is what a front-end author validates against, and an
  # end-to-end `check` is what the driver actually emits.
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: ./scripts/check-schemas.sh
      # And the fixtures are recorded from a real run rather than written by
      # hand, so they cannot describe an artifact nobody produces.
      - run: ./scripts/record-fixtures.sh --check

  # The TUI suite is the reason macOS runs at all: terminal behavior is
  # where the platforms actually differ.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          TERMLENS_ARTIFACT_DIR: ${{ runner.temp }}/termlens
      # The one gate whose whole point is a second platform's terminal, run
      # through the command a maintainer would use by hand: `termlens inspect`
      # against the real binary, compared with the checked-in golden.
      - run: cargo test -p reconverge-tui --test cli -- --ignored
        env:
          TERMLENS_ARTIFACT_DIR: ${{ runner.temp }}/termlens
      - uses: vyncint/termlens/.github/actions/report@b8af0fa457dd023aa708a493b7f485256009f1a5 # v0.11.0
        if: failure()
        with:
          name: termlens-report-macos
      # The gate scripts are Linux-only for cost, but their portability is
      # not: both prune with `sed` on every run, and the BSD form macOS
      # ships took the expression as a backup suffix and died. This is the
      # cheapest thing that reads them on the platform that broke.
      - run: bash -n scripts/run-conformance.sh scripts/run-mutation-corpus.sh

  # The vendored termlens skill is refreshed by hand and AGENTS.md makes it
  # normative for every PTY test here, so a stale copy silently instructs the
  # next contributor to write code that no longer compiles. Nothing can diff
  # it against upstream — the published crate does not ship the skill — but
  # the two versions agreeing is checkable, and that is the drift that
  # happens. The script also holds the two manifests to the same termlens
  # version, which nothing else does: termlens is deliberately not in
  # `[workspace.dependencies]`, and deny.toml only warns on duplicates.
  skill-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-skill-version.sh

  # Public API compatibility of the five published library crates against
  # the last release on crates.io, on every pull request. The release type
  # is FORCED: left to infer it from the version number, cargo-semver-checks
  # treats a 0.x minor bump as a major release and skips every check, so a
  # PR that bumps the version in the same change as a break is green with
  # zero checks run. A PR that must break a promised item carries the
  # `breaking` label, which runs the gate as `major` — the checker's name
  # for what docs/RELEASING.md calls a 0.x minor release; `minor` would
  # still fail on the break, which is the point of forcing the type. The
  # diagnostics stay visible in the job. `baseline-version` is a literal,
  # bumped in a PR after each publish (the baseline must be on the index).
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      # Two ways to declare a break, because the label is only legible on a
      # pull request. `github.event.pull_request` does not exist on a push,
      # so the label expression silently yielded `patch` there — and the
      # first break merged with the label turned every subsequent push to
      # `main` red until the release bumped the baseline, which is exactly
      # what happened to #137.
      #
      # The second way is the CHANGELOG, which is the document a release is
      # cut from: a `### Breaking` heading under `## [Unreleased]` says this
      # tree deliberately breaks the published baseline. That makes the push
      # gate mean something rather than nothing — merge a break without
      # recording it and this fails, which is a better rule than the label
      # alone ever was.
      - name: Decide the release type
        id: release_type
        env:
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'breaking') }}
        run: |
          set -euo pipefail
          declared=no
          if awk '/^## \[Unreleased\]/{u=1;next} /^## \[/{u=0} u && /^### Breaking/{found=1} END{exit !found}' CHANGELOG.md; then
            declared=yes
          fi
          if [ "$LABELLED" = "true" ] || [ "$declared" = yes ]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi
          echo "breaking label: $LABELLED; CHANGELOG declares a break: $declared"
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: reconverge-core,reconverge-artifacts,reconverge-dialect-oxide,reconverge-witness,reconverge-tui
          baseline-version: 0.6.1
          release-type: ${{ steps.release_type.outputs.type }}

  # The five library crates declare `rust-version = "1.88"` (ratatui 0.30's
  # floor); only the driver needs the pinned nightly. Build them on exactly
  # that stable so the declaration is a measurement, not a hope.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.88 --profile minimal
      - run: >-
          cargo +1.88 check --locked
          -p reconverge-core -p reconverge-artifacts -p reconverge-dialect-oxide
          -p reconverge-witness -p reconverge-tui

  # The single required status check: green iff every Linux gate is green.
  required-green:
    name: required-green
    if: always()
    needs: [fmt, clippy, test, docs, deny, isolation, conformance, schemas, skill-version, semver, msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gate succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gate results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "a required gate did not succeed" >&2
              exit 1
            fi
          done
