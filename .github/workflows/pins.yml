# Pin watch: reports when upstream cuda-oxide moves past what this repository
# analyzes against, by opening one issue. It NEVER bumps a pin — a bump is a
# human decision, its own commit, and a conformance re-run (docs/RELEASING.md:
# toolchain bumps are minor releases, never mixed with analysis changes).
#
# Three things drift independently, and only the first was ever visible:
#   1. the commit   — conformance/PIN vs upstream HEAD
#   2. the toolchain — the channel of the rust-toolchain file governing
#      upstream's device crate (not its root one since the monorepo
#      split; scripts/upstream-layout.sh finds it) vs ours
#      (upstream moved to nightly-2026-08-28 on 2026-08-29 and this
#      repository did not notice for eleven days; the driver is a
#      rustc_private tool, so that gap means kernels tracking upstream
#      cannot be analyzed at all)
#   3. the analysis surface — a public function in upstream's warp /
#      cooperative_groups / barrier / grid / cluster modules that the
#      dialect neither classifies nor allowlists. Unknown means `Other`,
#      which is a coverage note and never a finding: a silent false negative
#      until someone updates simt.rs. scripts/check-surface.sh is the gate;
#      here it runs against HEAD so the drift is reported before the pin moves.
name: pins
on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday morning UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write

# A dispatch on top of the weekly tick would otherwise open the issue twice.
concurrency:
  group: pins
  cancel-in-progress: false
env:
  UPSTREAM_REPO: NVlabs/cuda-oxide
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare upstream to the pins
        run: |
          set -euo pipefail
          drift=""
          read -r pin _ < <(grep -v '^#' conformance/PIN | head -1)
          head_sha=$(gh api "repos/$UPSTREAM_REPO/commits/HEAD" -q '.sha')
          if [ "$head_sha" != "$pin" ]; then
            behind=$(gh api "repos/$UPSTREAM_REPO/compare/${pin}...${head_sha}" -q '.ahead_by')
            drift="$drift- commit: upstream HEAD is \`${head_sha:0:8}\`, conformance/PIN is \`${pin:0:8}\` ($behind commits behind)"$'\n'
          fi
          # A shallow checkout of HEAD, which both remaining checks read.
          upstream="$RUNNER_TEMP/upstream"
          mkdir -p "$upstream" && git -C "$upstream" init -q
          git -C "$upstream" fetch -q --depth 1 "https://github.com/$UPSTREAM_REPO" "$head_sha"
          git -C "$upstream" checkout -q FETCH_HEAD
          # The toolchain that governs upstream's DEVICE crate, wherever the
          # crate now sits. Since the monorepo split (2d47e43) the root file
          # is the host workspace's stable pin; comparing it reported
          # "upstream pins 1.98.0", which says nothing about which rustc a
          # kernel crate needs, while the change that does matter — the
          # device toolchain moving to its own file — went unseen (#207).
          # The locator exits 2 on a layout it does not know, which fails
          # this step rather than comparing against nothing.
          ours=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          toolchain_file=$(./scripts/upstream-layout.sh "$upstream" toolchain)
          toolchain_rel=${toolchain_file#"$(cd "$upstream" && pwd -P)"/}
          theirs=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$toolchain_file")
          if [ -z "$theirs" ]; then
            echo "::error::no \`channel = \"…\"\` line in upstream's $toolchain_rel"
            exit 1
          fi
          if [ "$ours" != "$theirs" ]; then
            drift="$drift- toolchain: upstream's device crate pins \`$theirs\` (\`$toolchain_rel\`), this repository pins \`$ours\`"$'\n'
          fi
          # Surface: the same gate CI runs against the pinned checkout. Exit 1
          # is the answer (unknown names); anything else is the gate failing
          # to run, and its output is the report. Reading that as "no
          # unknown names" printed an empty surface list for a month (#207).
          rc=0
          surface=$(./scripts/check-surface.sh "$upstream" 2>&1) || rc=$?
          case $rc in
            0) ;;
            1)
              drift="$drift- surface: functions neither classified nor allowlisted at upstream HEAD:"$'\n'"$(printf '%s\n' "$surface" | sed -n 's/^unknown: /    - `/p' | sed 's/$/`/')"$'\n'
              ;;
            *)
              printf '%s\n' "$surface" >&2
              echo "::error::check-surface.sh exited $rc against upstream HEAD ${head_sha:0:8}; the surface was not enumerated"
              exit 1
              ;;
          esac
          if [ -z "$drift" ]; then
            echo "Pins current."
            exit 0
          fi
          printf 'Drift:\n%s' "$drift"

          # The drift sits between markers so the next run can tell what the
          # open issue last said. Deduplicating on the title alone muted every
          # later kind of drift once one issue was open: #166 said "73 commits
          # behind" for a month while the toolchain and the surface moved.
          title="pins: upstream cuda-oxide moved past the conformance pin"
          body_file="$RUNNER_TEMP/pins-body.md"
          printf 'Weekly pin watch found upstream movement:\n\n<!-- pins:drift -->\n%s<!-- /pins:drift -->\n\nPolicy (docs/RELEASING.md): the toolchain and the conformance pin move together, in their own commit, never mixed with an analysis change, and conformance must pass at the new pin before it lands. A surface entry means a new upstream primitive: classify it in simt.rs or allowlist it in conformance/SURFACE_ALLOW with a reason — never leave it as Other by default. This workflow never bumps; a human decides.\n' "$drift" > "$body_file"
          number=$(TITLE="$title" gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "in:title \"$title\"" --json number,title \
              --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file"
            exit 0
          fi
          old=$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body -q .body \
            | awk '/<!-- pins:drift -->/{f=1; next} /<!-- \/pins:drift -->/{f=0} f')
          if [ "$old" = "$(printf '%s' "$drift")" ]; then
            echo "#$number already reports exactly this drift."
            exit 0
          fi
          # The body always carries the current state. A comment — which is
          # what notifies — only when the KIND of drift changed: the commit
          # count moves every week and is not news; a new toolchain, a new
          # surface name, or a drift that appeared or cleared is.
          kinds() { printf '%s\n' "$1" | sed -E 's/^- commit: .*/- commit/'; }
          gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          echo "updated #$number to the current drift"
          if [ "$(kinds "$old")" != "$(kinds "$drift")" ]; then
            printf 'The drift changed since this issue last reported it. Now:\n\n%s' "$drift" > "$RUNNER_TEMP/pins-comment.md"
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pins-comment.md"
          fi
