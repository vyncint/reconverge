name: commit-policy

on:
  pull_request:
  push:
    branches: [main]
  # Also a job of ci.yml, which is what makes it gate: the ruleset's one
  # required context is `required-green`, and as a workflow of its own this
  # never fed it — PR #84 merged with commit-policy red (#209). The triggers
  # above stay so the check keeps its own line on a pull request and its PR
  # comment; the copy inside CI is the one a merge waits for.
  workflow_call:
    inputs:
      from-ci:
        description: Set by ci.yml. Only the standalone run posts the PR comment, so a failure is explained once.
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

# A superseded run of this gate has nothing left to report. The two copies
# get separate groups: sharing one, a standalone run and the copy inside CI
# on the same ref would cancel each other, and a cancelled job inside CI
# fails `required-green`.
concurrency:
  group: commit-policy-${{ inputs.from-ci && 'ci' || 'own' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE..$HEAD"
          elif [ "$EVENT" != "push" ]; then
            # Inside ci.yml this also runs on workflow_dispatch, which names
            # no commits: `before` and `after` are empty, the range came out
            # as `..`, and both checks printed "inspected 0 commit(s) ... OK"
            # over a git error. Nothing reaches main that way, so say so.
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "a $EVENT run names no new commits; nothing to inspect"
            exit 0
          elif printf '%s' "$BEFORE" | grep -qE '^0+$'; then
            # initial push: inspect the entire history
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "inspecting commits in: $range"

      - name: DCO sign-off on every commit
        if: steps.range.outputs.skip != 'true'
        env:
          RANGE: ${{ steps.range.outputs.range }}
          # On a push to main, the tip is the commit GitHub composed by
          # squash-merging a pull request. Naming it lets the check tell that
          # one commit apart from anything else with a web-flow committer, so
          # a message GitHub wrote without the trailers it squashed does not
          # fail a pull request that was, in fact, signed off. Empty on
          # pull_request runs, where nothing is exempt.
          COMPOSED: ${{ github.event_name == 'push' && github.event.after || '' }}
        run: .github/scripts/check-dco.sh "$RANGE" "$COMPOSED"

      - name: No AI attribution on any commit
        # run even when the DCO step failed, so both reports land at once
        if: (success() || failure()) && steps.range.outputs.skip != 'true'
        # Through `env:` rather than expanded into the script line: a `${{ }}`
        # inside a `run:` block is substituted before bash ever sees it, so a
        # ref name is interpolated as shell rather than passed as an argument.
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: .github/scripts/check-no-ai-attribution.sh "$RANGE"

      # The guidance has to survive a fork PR, where GITHUB_TOKEN is
      # read-only no matter what `permissions:` above asks for — so it
      # goes to the job summary, which needs no token at all. Posting a
      # comment is the nicer surface when it works, so it is still tried,
      # but it can no longer turn a clean report into a failed step.
      - name: Explain the policy in the job summary
        if: failure()
        run: |
          {
            echo '## The commit-policy gate failed'
            echo
            echo '- Every commit must be signed off (`git commit -s`); the `Signed-off-by:`'
            echo '  trailer must match the commit author (DCO).'
            echo '- Because pull requests here are squash-merged, GitHub rewrites the author'
            echo '  to your account'"'"'s commit email. If you keep your address private that is'
            echo '  `ID+username@users.noreply.github.com`, so sign off with that same address'
            echo '  or the trailer will not match once the commit lands on `main`.'
            echo '- AI assistance is welcome; AI attribution is not. Remove the trailer and'
            echo '  recommit — you are the author of record.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post the policy comment on the PR (once)
        if: failure() && github.event_name == 'pull_request' && !inputs.from-ci
        # A fork PR cannot be commented on with this token; the summary
        # above already carries the guidance, so never fail the job here.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- commit-policy-gate -->'
          if gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[].body' | grep -qF "$marker"; then
            echo "policy comment already present; not repeating it"
            exit 0
          fi
          {
            echo "$marker"
            echo "The commit-policy gate failed on this PR."
            echo
            echo '- Every commit must be signed off (`git commit -s`); the `Signed-off-by:` trailer must match the author identity (DCO).'
            echo '- Pull requests are squash-merged, so GitHub rewrites the author to your account commit email; sign off with that same address.'
            echo '- AI assistance is welcome; AI attribution is not. Remove the trailer and recommit — you are the author of record.'
          } > /tmp/policy-comment.md
          gh pr comment "$PR" --body-file /tmp/policy-comment.md
