# Release: build the binaries for a tag, and publish the crates.
#
# Publishing is deliberate and manual — dispatch only, never on push — and
# it is irreversible: a crates.io version can be yanked but never deleted.
# So `dry_run` defaults to true. Run it once as a dry run, read the log,
# then run it again with dry_run disabled.
#
# Authentication is crates.io Trusted Publishing: the publish job mints a
# GitHub OIDC token and exchanges it for a ~30-minute crates.io token, so
# no long-lived registry secret exists anywhere. Every crate must list this
# repository + workflow file as a trusted publisher in its crates.io
# settings; one exchanged token covers all of them.
#
# Publish order follows the dependency graph: artifacts → core → dialect →
# witness → driver → tui → cargo-reconverge. `cargo publish` waits for each
# crate to appear in the index before the next one resolves it.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (e.g. v0.1.1)"
        required: true
        type: string
      dry_run:
        description: "Validate without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Never cancel: seven crates published in dependency order is not something to
# stop halfway, and a second dispatch of the same tag should queue behind the
# first rather than race it.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag and the manifest have to name the same version before anything
  # is built. Nothing downstream compared them: `publish` reads the version
  # out of the manifest and the archives, the GitHub Release and `v0` are
  # named after the tag, so a tag on the wrong commit would skip every
  # publish as "already published" and still ship a release under the
  # wrong name (#210). Checked on the dry run too, which is where a wrong
  # tag should be found.
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: The tag names the version every published crate declares
        env:
          TAG: ${{ inputs.tag }}
          # The runner's stable cargo, not the pinned nightly: reading the
          # manifests needs no rustc-dev, and materializing it costs minutes
          # before the first thing that can fail.
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, os, sys
          tag = os.environ["TAG"]
          bad = [p["name"] + " " + p["version"]
                 for p in json.load(sys.stdin)["packages"]
                 if p.get("publish") != [] and "v" + p["version"] != tag]
          if bad:
              print(f"::error::tag {tag} does not match the manifest at that tag: " + ", ".join(bad))
              sys.exit(1)
          print(f"every published crate at {tag} declares {tag[1:]}")
          '

  build:
    needs: verify-tag
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo build --release -p cargo-reconverge -p reconverge-driver -p reconverge-tui
      # One archive per platform, named by the host triple rather than by the
      # runner label: `macos-latest` says nothing about the architecture it
      # was on the day the release was cut, and the file name is what a user
      # reads. The checksum sits beside it because a binary downloaded over
      # HTTP with nothing to check it against is a binary you are trusting
      # twice.
      - name: Package the three binaries
        id: package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          name="reconverge-${TAG}-${triple}"
          mkdir -p "dist/${name}"
          cp target/release/cargo-reconverge \
             target/release/reconverge-driver \
             target/release/reconverge-tui \
             README.md LICENSE-APACHE LICENSE-MIT "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "packaged ${name}.tar.gz"
          cat "dist/${name}.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  publish:
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Mint the OIDC token Trusted Publishing exchanges for a short-lived
      # crates.io token. This is the only credential the job ever holds.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      # Minted last, right before publishing: the exchanged token lives
      # ~30 minutes. A dry run publishes nothing and needs no token.
      - name: Authenticate to crates.io (Trusted Publishing)
        if: ${{ !inputs.dry_run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            # A dry run can only verify crates whose dependencies already
            # resolve from the index; for a first publish that is the leaf
            # crates. The rest are checked for packaging problems instead.
            echo "::notice::dry run — nothing will be published"
          fi
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          # verify-tag already held every crate to the tag; this is the
          # number the loop below actually publishes, held to it again.
          if [ "v$version" != "$TAG" ]; then
            echo "::error::about to publish $version, but the tag is $TAG"
            exit 1
          fi
          echo "publishing version $version"

          for crate in \
            reconverge-artifacts \
            reconverge-core \
            reconverge-dialect-oxide \
            reconverge-witness \
            reconverge-driver \
            reconverge-tui \
            cargo-reconverge
          do
            echo "::group::$crate"
            # Publishing is resumable: crates.io rate-limits new crates, so a
            # first release can stop partway through. Anything already on the
            # index at this version is skipped rather than re-uploaded.
            if curl -sfI -H "User-Agent: reconverge-release" \
                 "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
              echo "$crate $version is already published — skipping"
            elif [ "$DRY_RUN" = "true" ]; then
              cargo publish --dry-run -p "$crate" || {
                echo "::warning::$crate could not be verified yet — its \
                  dependencies reach the index only once an earlier crate in \
                  this list is actually published"
              }
            else
              cargo publish -p "$crate"
            fi
            echo "::endgroup::"
          done

  # The GitHub Release, with the archives the `build` job produced attached.
  #
  # Until now `build` compiled three binaries per platform on every release
  # and left them in workflow artifacts, which expire and need a GitHub login
  # to reach -- so `v0.6.1` shipped with zero assets and the only supported
  # install was `cargo install`, which compiles a rustc-driver. The action
  # pays that on every consumer's run, deliberately uncached.
  #
  # The notes come from CHANGELOG.md rather than from `--generate-notes`. The
  # changelog here is written for a reader; a list of squashed commit subjects
  # would be a downgrade, and it is also the document the release was cut
  # from, so the two cannot disagree.
  github-release:
    needs: [build, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # creates the release and uploads its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Extract this version's changelog section
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # From the heading for this version to the next `## [` heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/        { exit }
            inside                     { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section; write it before releasing"
            exit 1
          fi
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          if [ -z "$channel" ]; then
            echo "::error::no channel in rust-toolchain.toml"
            exit 1
          fi
          {
            echo
            echo '## Install'
            echo
            echo '```sh'
            echo 'cargo install cargo-reconverge'
            echo 'cargo reconverge setup'
            echo '```'
            echo
            echo 'Or take a prebuilt archive below and put the three binaries'
            echo 'on your PATH -- `cargo-reconverge` looks for the driver and'
            echo 'the views beside its own executable, then on PATH. The driver'
            echo "loads the pinned nightly's compiler library, so that"
            echo 'toolchain is the one thing to install:'
            echo
            echo '```sh'
            echo "rustup toolchain install ${channel} --profile minimal --no-self-update"
            echo '```'
            echo
            echo 'Verify the archive first:'
            echo
            echo '```sh'
            echo 'shasum -a 256 -c reconverge-'"$TAG"'-<triple>.tar.gz.sha256'
            echo '```'
          } >> notes.md
          echo "release notes:"; cat notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing its notes and assets"
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber

  # `v0` is what README.md and action/README.md tell people to write. Until
  # now they said `@main`, because there was no floating tag to point at --
  # so every consumer's CI silently followed this repository's default
  # branch, and a merge here changed the analyzer running in somebody else's
  # pull request with no version to pin and no notice. The sibling project
  # has had this job since 2.0.
  #
  # After `publish`, so the floating tag can never point at a release that
  # did not reach crates.io -- which matters more here than usual, because
  # the action installs the version the ref's own manifest declares.
  float-major-tag:
    needs: [publish, github-release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # moves refs/tags/vN
    steps:
      # The ref is moved through the API rather than by pushing, so the job
      # never needs a git credential in its working tree: the checkout is
      # only here to resolve the tag to a commit, and it keeps
      # `persist-credentials: false` like every other one in this repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Point vN at the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # A dispatch can be handed anything, so the tag has to exist and be
          # a version before a floating pointer is aimed at it.
          sha="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}")" || {
            echo "::error::no such tag: '$TAG'"; exit 1
          }
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$TAG' is not a release tag (expected vX.Y.Z)"; exit 1 ;;
          esac
          major="v${TAG#v}"
          major="${major%%.*}"
          case "$major" in
            v[0-9]*) ;;
            *) echo "::error::cannot derive a major tag from '$TAG'"; exit 1 ;;
          esac
          # Forward only. A patch on an older line (v0.6.2 cut after v0.7.0)
          # would otherwise drag `v0` back to it, and every consumer pinned
          # to `@v0` would silently downgrade (#210). Where vN stands now is
          # the highest release tag on the commit it points at.
          if current_sha="$(git rev-parse -q --verify "refs/tags/${major}^{commit}")"; then
            current="$(git tag --points-at "$current_sha" --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
            if [ -z "$current" ]; then
              echo "::warning::$major points at ${current_sha:0:8}, which carries no release tag; moving it to $TAG"
            elif [ "$(printf '%s\n' "$current" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]; then
              echo "::notice::$major stays at $current — $TAG is older, and $major only moves forward"
              exit 0
            fi
          fi
          if gh api "repos/$REPO/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$major" \
              -f "sha=$sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" \
              -f "ref=refs/tags/$major" -f "sha=$sha" >/dev/null
          fi
          echo "$major now points at $TAG (${sha:0:8})"

  # Tell the repository that tests this tool against a real subject that a
  # new version exists, so the deep run happens now rather than at its next
  # scheduled tick.
  #
  # Best-effort by design. The testing repositories all resolve "latest" from
  # crates.io on a schedule of their own, so a dispatch that never arrives --
  # an expired token, a release cut by hand, a fork without the secret --
  # costs latency and nothing else. That is why this job never fails the
  # release: a published crate is published whether or not the notification
  # landed.
  #
  # Needs a PAT with `contents: write` on simt-diff, stored as
  # TESTING_REPO_DISPATCH_TOKEN. Without it the job says so and exits clean.
  notify-testing-repo:
    name: notify-testing-repo
    needs: publish
    # NOT `github.event_name == 'push'`: this workflow has no `push:` trigger
    # (see the header), so that condition was unsatisfiable and the job had
    # never run once. What distinguishes a real publish here is the dispatch
    # input, so that is what it asks.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Dispatch to simt-diff
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TESTING_REPO_DISPATCH_TOKEN }}
          # `inputs.tag`, like every other step in this file: a dispatch
          # runs from a branch, so `github.ref_name` here is `main`.
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::TESTING_REPO_DISPATCH_TOKEN is not set; simt-diff will pick this up on its own schedule instead"
            exit 0
          fi
          # A non-2xx is named rather than swallowed: the job stays
          # `continue-on-error`, so a broken notification still cannot fail
          # a release, but "it worked" and "it never ran" stop looking the
          # same from the outside.
          #
          # The call is the `if` condition, not a bare assignment: the step
          # runs under `bash -e`, so a failing `out=$(...)` exited before
          # `status=$?` was read, and neither warning nor gh's own message
          # was ever printed (#210).
          if out=$(gh api repos/vyncint/simt-diff/dispatches \
            -f event_type=tool-published \
            -F "client_payload[version]=${TAG#v}" 2>&1); then
            echo "dispatched tool-published to simt-diff for ${TAG#v}"
          else
            status=$?
            echo "::warning::could not dispatch to simt-diff (gh exit $status): $out"
            echo "::warning::simt-diff will pick ${TAG#v} up on its own schedule instead"
            exit 1
          fi

  # Verify what was published, the way a user installs it: install.yml, for
  # this version. It used to listen for `release: published` instead, but
  # `github-release` above creates the release with `github.token`, and
  # events that token causes start no workflow -- so it never fired, and
  # 0.7.0 shipped with no install run of any kind. A dispatch is the one
  # event the token may cause.
  #
  # Not best-effort, unlike the job above: it needs no secret, so a failure
  # here is a broken workflow and should read as one. install.yml waits for
  # the index itself.
  verify-install:
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatches install.yml
    steps:
      - name: Dispatch install.yml for this version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The default branch's install.yml, the newest verifier, rather
          # than the copy at the tag.
          BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run install.yml --repo "$REPO" --ref "$BRANCH" -f "version=${TAG#v}"
          echo "dispatched install.yml on $BRANCH for ${TAG#v}"
