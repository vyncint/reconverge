[package]
name = "conformance-extractor"
description = "Extracts kernel modules from pinned upstream examples into kernel-only conformance crates"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone tool: not a member of the reconverge workspace (it runs against
# a separate upstream checkout). Because it is its own workspace, a release
# version bump must refresh this crate's Cargo.lock as well — the
# conformance scripts build with --locked and fail on drift.
[workspace]

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
# The dialect itself decides which collectives the mutation corpus may
# target, so the corpus can never drift from what the analyzer recognizes.
reconverge-core = { path = "../../crates/reconverge-core" }
reconverge-dialect-oxide = { path = "../../crates/reconverge-dialect-oxide" }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
