[package]
name = "reconverge-tui"
description = "Terminal UI for reconverge: inspector, witness debugger, learn mode, triage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["gpu", "tui", "terminal", "debugging"]
categories = ["command-line-utilities", "development-tools::debugging"]
# The integration tests need sibling binaries and repo fixtures that a
# published package cannot carry; they run from the repository.
exclude = ["/tests"]

[dependencies]
# INVARIANT (docs/ARCHITECTURE.md): reconverge-artifacts is the only workspace
# dependency the TUI may ever have; scripts/check-isolation.sh enforces it.
reconverge-artifacts = { path = "../reconverge-artifacts", version = "0.1.6" }
ratatui = "0.30"
serde_json = { workspace = true }
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
# Headless PTY harness (docs/ARCHITECTURE.md), from crates.io since 0.3.0
# (the old git pin ecad6dac IS the 0.3.0 release commit). Upgrade
# deliberately via Cargo.lock, never `*` — the golden frames make any
# behavior change visible. default-features off: no insta, goldens are
# plain files.
termlens = { version = "0.3.0", default-features = false }
