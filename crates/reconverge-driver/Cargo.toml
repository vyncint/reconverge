[package]
name = "reconverge-driver"
description = "Compiler driver that runs reconverge analyses and emits versioned artifacts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
documentation = "https://github.com/vyncint/reconverge"
keywords = ["gpu", "cuda", "static-analysis", "compiler"]
categories = ["development-tools"]
# The integration tests need sibling binaries and repo fixtures that a
# published package cannot carry; they run from the repository.
exclude = ["/tests"]

[dependencies]
reconverge-core = { path = "../reconverge-core", version = "0.1.12" }
reconverge-dialect-oxide = { path = "../reconverge-dialect-oxide", version = "0.1.12" }
reconverge-witness = { path = "../reconverge-witness", version = "0.1.12" }
reconverge-artifacts = { path = "../reconverge-artifacts", version = "0.1.12" }
serde_json = { workspace = true }
