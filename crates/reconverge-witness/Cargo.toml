[package]
name = "reconverge-witness"
description = "Warp-accurate MIR interpreter that replays counterexample witnesses"
version.workspace = true
edition.workspace = true
# MSRV of the library crates; the driver alone needs rust-toolchain.toml's nightly.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["gpu", "simt", "interpreter", "debugging"]
categories = ["development-tools::debugging"]

[dependencies]
reconverge-artifacts = { path = "../reconverge-artifacts", version = "0.5.0" }
reconverge-core = { path = "../reconverge-core", version = "0.5.0" }
