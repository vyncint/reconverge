[package]
name = "verdict-samples"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone, like `lint-samples`: the CLI tests compile this crate through
# `cargo reconverge check` exactly the way a user's kernel crate is compiled.
# It is deliberately separate from `lint-samples` because every kernel here
# exists for the *confidence* of its finding — a `confirmed` the witness must
# not award, or one it must — and for the `replay:` note that says why. The
# 2026-10-31 review found four ways the replay awarded one it had not earned
# (#190, #191, #192, #194); each has its probe here, beside the control that
# shows the fix did not cost the true positive next to it.
[workspace]

[dependencies]
# Same pinned rev as the driver's sample crate; conformance/PIN records it.
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide", rev = "b0f961df3af0ff140b3b006fa2b6750b71f43f62" }
