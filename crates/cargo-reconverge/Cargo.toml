[package]
name = "cargo-reconverge"
description = "Cargo subcommand for reconverge: static reconvergence analysis for Rust GPU kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["gpu", "cuda", "static-analysis", "linter", "cargo-subcommand"]
categories = ["development-tools::cargo-plugins", "development-tools"]
# The integration tests need sibling binaries and repo fixtures that a
# published package cannot carry; they run from the repository.
exclude = ["/tests"]

[dependencies]
reconverge-artifacts = { path = "../reconverge-artifacts", version = "0.3.0" }
reconverge-dialect-oxide = { path = "../reconverge-dialect-oxide", version = "0.3.0" }
serde_json = { workspace = true }

[dev-dependencies]
# Same version as reconverge-tui (see its Cargo.toml for the pinning
# policy): the end-to-end tests drive the TUI subcommands through a PTY.
termlens = { version = "0.6.0", default-features = false }
