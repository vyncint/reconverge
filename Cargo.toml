[workspace]
resolver = "3"
members = [
    "crates/reconverge-core",
    "crates/reconverge-dialect-oxide",
    "crates/reconverge-driver",
    "crates/reconverge-witness",
    "crates/reconverge-artifacts",
    "crates/reconverge-tui",
    "crates/cargo-reconverge",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vyncint/reconverge"
# Published to crates.io; releases are cut by hand, never on push.
publish = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
